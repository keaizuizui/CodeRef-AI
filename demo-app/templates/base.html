<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>演示应用</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 0; }
    header { background: #2c3e50; color: #fff; padding: 12px 20px; }
    header nav a { color: #fff; margin-right: 16px; text-decoration: none; }
    main { display: flex; min-height: 80vh; }
    aside { width: 240px; border-right: 1px solid #ddd; padding: 12px; }
    section { flex: 1; padding: 20px; }
    ul.menu, ul.menu ul { list-style: none; padding-left: 16px; }
    ul.menu li { margin: 4px 0; }
    a { color: #2980b9; }
    .btn { display: inline-block; padding: 4px 12px; background: #27ae60; color: #fff; text-decoration: none; }
    button { padding: 4px 12px; }
    .danger { color: #c0392b; }
  </style>
</head>
<body>
  <header>
    <h1>演示应用</h1>
    <nav>
      <a href="/">首页</a>
      <a href="/settings">设置</a>
      <a href="/logout">登出</a>
    </nav>
  </header>

  <main>
    <!-- 左侧：真正的 5 级嵌套菜单树 -->
    <aside>
      <ul class="menu" id="menuTree">
        <li>
          <span>L1 / 系统管理</span>
          <ul>
            <li>
              <span>L2 / 用户中心</span>
              <ul>
                <li>
                  <span>L3 / 用户管理</span>
                  <ul>
                    <li>
                      <span>L4 / 角色权限</span>
                      <ul>
                        <li><a class="leaf" href="#">L5 / 查看权限</a></li>
                        <li><a class="leaf" href="#">L5 / 编辑权限</a></li>
                      </ul>
                    </li>
                  </ul>
                </li>
                <!-- 问题3：L3 死链，href="#" 且无任何点击处理 -->
                <li><a class="dead" href="#">L3 / 死链项</a></li>
              </ul>
            </li>
            <li>
              <span>L2 / 内容管理</span>
              <ul>
                <li><a href="#">文章列表</a></li>
              </ul>
            </li>
          </ul>
        </li>
      </ul>
    </aside>

    <!-- 右侧内容区 -->
    <section id="content">
      <h2 id="pageTitle">首页</h2>

      <!-- 表单 + 问题2：提交按钮无 loading / 无禁用态 -->
      <form id="mainForm">
        <label>名称：</label>
        <input type="text" name="name">
        <button type="button" onclick="submitForm()">提交</button>
      </form>

      <hr>

      <!-- 问题1：删除按钮，onclick 直接执行删除，无二次确认 -->
      <button type="button" class="danger" onclick="deleteItem(1)">删除记录</button>

      <!-- 问题6：两个"保存"按钮交互风格不一致 -->
      <button type="button" onclick="saveA()">保存（按钮·带确认）</button>
      <a class="btn" href="#" onclick="saveB()">保存（链接·无确认）</a>

      <hr>
      <h3>数据列表</h3>
      <ul id="dataList"></ul>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
